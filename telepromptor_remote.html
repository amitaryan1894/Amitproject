<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teleprompter Remote</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="p-3">
<h4>Teleprompter Remote</h4>

<div class="d-flex flex-wrap gap-2">
  <button class="btn btn-primary w-100" id="playPause">▶ / ⏸</button>
  <button class="btn btn-secondary w-50" id="speedUp">Speed +</button>
  <button class="btn btn-secondary w-50" id="speedDown">Speed −</button>
  <input type="range" id="speedSlider" min="0.1" max="3" step="0.05" value="0.6" class="w-100">
  <button class="btn btn-warning w-100" id="next">Next Script</button>
  <button class="btn btn-info w-100" id="mirror">Mirror Toggle</button>
  <button class="btn btn-secondary w-50" id="fontUp">Font +</button>
  <button class="btn btn-secondary w-50" id="fontDown">Font −</button>
  <button class="btn btn-secondary w-100" id="highlightBtn">✨ Highlight</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

// Firebase config (same as index.html)
const firebaseConfig = {
  apiKey: "AIzaSyAOLJjrcw_9hi_RbwJTdRv2ZFPEKSDOrt4",
  authDomain: "github-8e32d.firebaseapp.com",
  databaseURL: "https://github-8e32d-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "github-8e32d",
  storageBucket: "github-8e32d.appspot.com",
  messagingSenderId: "301979365830",
  appId: "1:301979365830:web:21a72ef1ff0e47371482c7",
  measurementId: "G-JSV9ESJTN3"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Send command to Firebase
function sendCommand(cmd){set(ref(db, 'teleprompter/commands'), cmd);}

// Remote controls
$("#playPause").click(()=>sendCommand({action:"playPause"}));
$("#speedUp").click(()=>sendCommand({action:"speed", value:1.2}));
$("#speedDown").click(()=>sendCommand({action:"speed", value:0.5}));
$("#speedSlider").on("input",function(){sendCommand({action:"speed", value:parseFloat(this.value)});});
$("#next").click(()=>sendCommand({action:"nextScript"}));
$("#mirror").click(()=>sendCommand({action:"mirror"}));
$("#fontUp").click(()=>sendCommand({action:"fontUp"}));
$("#fontDown").click(()=>sendCommand({action:"fontDown"}));
$("#highlightBtn").click(()=>sendCommand({action:"highlight"}));
</script>

</body>
</html>
