<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teleprompter Remote</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
body{background:#111;color:#fff;padding:10px;}
button, input{margin:3px;}
</style>
</head>
<body>

<h4>Teleprompter Remote</h4>
<div class="d-flex flex-wrap gap-2">
  <button class="btn btn-success w-50" id="playBtn">Play ▶</button>
  <button class="btn btn-danger w-50" id="pauseBtn">Pause ⏸</button>

  <button class="btn btn-secondary w-50" id="speedUp">Speed +</button>
  <button class="btn btn-secondary w-50" id="speedDown">Speed −</button>
  <input type="range" id="speedSlider" min="0.1" max="3" step="0.05" value="0.6" class="w-100">

  <button class="btn btn-warning w-100" id="next">Next Script</button>

  <button class="btn btn-info w-50" id="mirrorOn">Mirror ON</button>
  <button class="btn btn-info w-50" id="mirrorOff">Mirror OFF</button>

  <label for="fontSlider" class="form-label w-100 mt-2">Font Size</label>
  <input type="range" id="fontSlider" min="20" max="100" step="1" value="40" class="form-range w-100">

  <button class="btn btn-secondary w-50" id="highlightOn">Highlight ON</button>
  <button class="btn btn-secondary w-50" id="highlightOff">Highlight OFF</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyAOLJjrcw_9hi_RbwJTdRv2ZFPEKSDOrt4",
  authDomain: "github-8e32d.firebaseapp.com",
  databaseURL: "https://github-8e32d-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "github-8e32d",
  storageBucket: "github-8e32d.appspot.com",
  messagingSenderId: "301979365830",
  appId: "1:301979365830:web:21a72ef1ff0e47371482c7",
  measurementId: "G-JSV9ESJTN3"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Debounce only for slider
let debounceTimeout=null;

// Instant send
function sendInstant(cmd){set(ref(db,'teleprompter/commands'),cmd);}

// Play / Pause
$("#playBtn").click(()=>sendInstant({action:"playPause", value:true}));
$("#pauseBtn").click(()=>sendInstant({action:"playPause", value:false}));

// Speed buttons instant
$("#speedUp").click(()=>sendInstant({action:"speed", value:1.2}));
$("#speedDown").click(()=>sendInstant({action:"speed", value:0.5}));

// Speed slider debounced
$("#speedSlider").on("input",function(){
    if(debounceTimeout) clearTimeout(debounceTimeout);
    debounceTimeout = setTimeout(()=>sendInstant({action:"speed", value:parseFloat(this.value)}),150);
});

// Next Script
$("#next").click(()=>sendInstant({action:"nextScript"}));

// Mirror explicit ON/OFF
$("#mirrorOn").click(()=>sendInstant({action:"mirror", value:true}));
$("#mirrorOff").click(()=>sendInstant({action:"mirror", value:false}));

// Font slider
$("#fontSlider").on("input", function(){
    let newSize = parseInt(this.value);
    sendInstant({action:"fontSize", value:newSize});
});

// Highlight explicit ON/OFF
$("#highlightOn").click(()=>sendInstant({action:"highlight", value:true}));
$("#highlightOff").click(()=>sendInstant({action:"highlight", value:false}));

</script>
</body>
</html>
