<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Pro Teleprompter – Smart Voice Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
body{margin:0;background:#000;color:#fff;overflow:hidden;font-family:system-ui;}
#prompter{position:fixed;inset:0;padding:40px 40px 120px;font-size:40px;}
#content{position:relative;line-height:1.7}
.word.active{background:#ffc107;color:#000;border-radius:4px;padding:2px 4px}
#tools{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.85);
padding:8px;display:flex;gap:6px;overflow-x:auto;z-index:999;}
.tool-btn{background:#222;color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:18px}
.tool-btn.active{background:#0d6efd}
.tool-range{width:80px}
#volume{position:fixed;left:10px;bottom:70px;width:120px;height:8px;background:#333;border-radius:5px;overflow:hidden}
#volume div{height:100%;width:0%;background:#0d6efd}
</style>
</head>

<body>

<div id="prompter">
 <div id="content">📝 Script जोड़ें और ▶ दबाएँ…</div>
</div>

<div id="volume"><div></div></div>

<div id="tools">
 <button class="tool-btn" id="play">▶</button>
 <button class="tool-btn" id="rewind">⏪</button>
 <button class="tool-btn active" id="voice">🎤</button>
 <button class="tool-btn" id="highlight">🔦</button>
 <button class="tool-btn" id="mirror">🪞</button>
 <input type="range" min="0.1" max="3" step="0.1" value="0.6" id="speed" class="tool-range">
 <input type="range" min="20" max="80" value="40" id="fontSize" class="tool-range">
 <input type="color" id="fontColor">
 <button class="tool-btn" data-bs-toggle="modal" data-bs-target="#scriptModal">📝</button>
 <button class="tool-btn" id="fullscreen">⛶</button>
</div>

<!-- SCRIPT MODAL (unchanged) -->
<div class="modal fade" id="scriptModal">
<div class="modal-dialog modal-lg modal-dialog-scrollable">
<div class="modal-content text-dark">
<div class="modal-header">
<h5 class="modal-title">Script Manager</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
<label>Script Name</label>
<input id="scriptName" class="form-control mb-2">
<label>Script Text</label>
<textarea id="scriptText" rows="6" class="form-control mb-3"></textarea>
<button class="btn btn-success w-100 mb-2" id="saveScript">💾 Save / Update</button>
<select id="scriptList" class="form-select mb-2"></select>
<button class="btn btn-primary w-100 mb-2" id="loadScript">▶ Load Script</button>
<button class="btn btn-danger w-100" id="deleteScript">🗑 Delete Script</button>
</div>
</div>
</div>
</div>

<script>
/* ========= SETTINGS STORAGE ========= */
const SETTINGS_KEY="teleprompterSettings";

function saveSettings(){
 localStorage.setItem(SETTINGS_KEY,JSON.stringify({
  voice,highlight,mirrored,speed,
  fontSize:$("#fontSize").val(),
  fontColor:$("#fontColor").val()
 }));
}

function loadSettings(){
 let s=JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}");
 if(s.voice!==undefined){voice=s.voice;$("#voice").toggleClass("active",voice);}
 if(s.highlight!==undefined){highlight=s.highlight;$("#highlight").toggleClass("active",highlight);}
 if(s.mirrored!==undefined){
  mirrored=s.mirrored;
  $("#mirror").toggleClass("active",mirrored);
  $("#content").css("transform",mirrored?"scaleX(-1)":"");
 }
 if(s.speed){speed=s.speed;$("#speed").val(speed);}
 if(s.fontSize){$("#fontSize").val(s.fontSize);$("#prompter").css("font-size",s.fontSize+"px");}
 if(s.fontColor){$("#fontColor").val(s.fontColor);$("#content").css("color",s.fontColor);}
}

/* ========= CORE ========= */
let ctx, analyser, data;
let micStarted=false;
let scrollPos=0, speed=0.6, paused=true;
let voice=true, highlight=false, mirrored=false;
let words=[], index=0;

/* MIC */
function startMic(){
 if(micStarted) return;
 micStarted=true;
 navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{
  ctx=new AudioContext();
  analyser=ctx.createAnalyser();
  let src=ctx.createMediaStreamSource(s);
  src.connect(analyser);
  analyser.fftSize=256;
  data=new Uint8Array(analyser.frequencyBinCount);
  loop();
 });
}

/* LOOP (same as before – unchanged logic) */
function loop(){
 analyser.getByteFrequencyData(data);
 let energy=data.slice(10,40).reduce((a,b)=>a+b,0);
 $("#volume div").css("width",Math.min(100,energy/5)+"%");
 if(!paused && voice && energy>120){
  scrollPos+=speed;
  if(highlight){
   $(".word").removeClass("active");
   $(`.word[data-i='${Math.floor(index)}']`).addClass("active");
   index+=speed*0.025;
  }
  $("#content").css("top",-scrollPos+"px");
 }
 requestAnimationFrame(loop);
}

/* ========= CONTROLS ========= */
$("#play").click(()=>{startMic();paused=!paused;$("#play").text(paused?"▶":"⏸");});
$("#voice").click(()=>{voice=!voice;$("#voice").toggleClass("active",voice);saveSettings();});
$("#highlight").click(()=>{highlight=!highlight;$("#highlight").toggleClass("active",highlight);saveSettings();});
$("#mirror").click(()=>{mirrored=!mirrored;$("#mirror").toggleClass("active",mirrored);
 $("#content").css("transform",mirrored?"scaleX(-1)":"");saveSettings();});
$("#speed").on("input",e=>{speed=parseFloat(e.target.value);saveSettings();});
$("#fontSize").on("input",e=>{$("#prompter").css("font-size",e.target.value+"px");saveSettings();});
$("#fontColor").on("input",e=>{$("#content").css("color",e.target.value);saveSettings();});
$("#fullscreen").click(()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen());

/* LOAD SETTINGS ON START */
loadSettings();
</script>

</body>
</html>
