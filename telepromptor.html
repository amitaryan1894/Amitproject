
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Smart Teleprompter</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
body{
    background:#111;
    color:#fff;
    overflow:hidden;
}
#prompter{
    height:75vh;
    overflow:hidden;
    border:2px solid #333;
    padding:20px;
    font-size:clamp(20px,4vw,42px);
}
#content{
    position:relative;
    line-height:1.6;
}
.control-box{
    font-size:14px;
}
@media(max-width:768px){
    .control-box{
        position:fixed;
        bottom:0;
        left:0;
        right:0;
        background:#000;
        z-index:999;
        border-top:2px solid #333;
        max-height:45vh;
        overflow:auto;
    }
    #prompter{
        height:85vh;
    }
}
</style>
</head>

<body>

<div class="container-fluid mt-2">
<div class="row g-2">

<!-- TELEPROMPTER -->
<div class="col-12 col-md-9 order-1">
    <div id="prompter">
        <div id="content">Script load करें और 🎤 Start दबाएँ…</div>
    </div>
</div>

<!-- CONTROLS -->
<div class="col-12 col-md-3 order-2 control-box" id="controls">

<div class="alert alert-info text-dark mb-2" id="micInfo">
🎤 Teleprompter के लिए Microphone permission जरूरी है
</div>

<button class="btn btn-warning w-100 mb-2 d-md-none" id="toggleControls">
⚙️ Controls
</button>

<label>Script Name</label>
<input type="text" id="scriptName" class="form-control mb-2">

<label>Script Text</label>
<textarea id="scriptText" rows="4" class="form-control mb-2"></textarea>

<button class="btn btn-success w-100 mb-2" id="saveScript">Save Script</button>

<select id="playlist" class="form-select mb-2" multiple></select>

<button class="btn btn-info w-100 mb-2" id="playNext">▶️ Play Next</button>
<button class="btn btn-danger w-100 mb-2" id="deleteScript">Delete Selected</button>

<label>Font Size</label>
<input type="range" min="20" max="80" value="32" id="fontSize" class="form-range">

<label>Font Color</label>
<input type="color" id="fontColor" class="form-control form-control-color mb-2">

<label>Sensitivity</label>
<input type="range" min="1" max="10" value="4" id="sensitivity" class="form-range mb-2">

<button class="btn btn-secondary w-100 mb-2" id="mirrorBtn">🪞 Mirror Mode</button>
<button class="btn btn-primary w-100" id="startMic">🎤 Start Teleprompter</button>

</div>
</div>
</div>

<script>
let audioContext=null, analyser=null, mic=null;
let dataArray, animationId=null;
let scrollPos=0, sensitivity=4;
let silenceTimer=0, silenceLimit=30;
let isPaused=false, mirrored=false;
let playIndex=0;

/* SAFE START MIC */
function startMic(){
    if(audioContext) return; // prevent duplicate

    navigator.mediaDevices.getUserMedia({ audio:true })
    .then(stream=>{
        $("#micInfo").hide();

        audioContext = new AudioContext();
        analyser = audioContext.createAnalyser();
        mic = audioContext.createMediaStreamSource(stream);
        mic.connect(analyser);

        analyser.fftSize = 256;
        dataArray = new Uint8Array(analyser.frequencyBinCount);

        animateScroll();
    })
    .catch(()=>{
        alert("Microphone permission denied ❌");
    });
}

/* SCROLL LOOP */
function animateScroll(){
    analyser.getByteFrequencyData(dataArray);

    let speechEnergy=0;
    for(let i=10;i<40;i++) speechEnergy+=dataArray[i];

    if(speechEnergy<200){
        silenceTimer++;
        if(silenceTimer>silenceLimit) isPaused=true;
    }else{
