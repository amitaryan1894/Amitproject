<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Pro Teleprompter – Studio Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
body{margin:0;background:#000;color:#fff;overflow:hidden;font-family:system-ui}
#prompter{position:fixed;inset:0;padding:40px 40px 140px;font-size:40px}
#content{position:relative;line-height:1.7}
.word.active{background:#ffc107;color:#000;border-radius:4px;padding:2px 4px}

#tools{
 position:fixed;bottom:0;left:0;right:0;
 background:rgba(0,0,0,.85);
 padding:8px;display:flex;gap:6px;
 overflow-x:auto;z-index:999
}
.tool-btn{background:#222;color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:18px}
.tool-btn.active{background:#0d6efd}
.tool-range{width:90px}

#volume{position:fixed;left:10px;bottom:90px;width:120px;height:8px;background:#333;border-radius:5px;overflow:hidden}
#volume div{height:100%;width:0%;background:#0d6efd}
</style>
</head>

<body>

<div id="prompter"><div id="content">📝 Script जोड़ें और ▶ दबाएँ…</div></div>
<div id="volume"><div></div></div>

<div id="tools">
 <button class="tool-btn" id="play">▶</button>
 <button class="tool-btn" id="rewind">⏪</button>

 <button class="tool-btn active" id="voice">🎤</button>
 <button class="tool-btn active" id="highlight">🔦</button>

 <!-- 🎚️ MIC SENSITIVITY -->
 <input type="range" min="60" max="200" value="120" id="sensitivity" class="tool-range" title="Mic Sensitivity">

 <input type="range" min="0.1" max="3" step="0.1" value="0.6" id="speed" class="tool-range">
 <input type="range" min="20" max="80" value="40" id="fontSize" class="tool-range">

 <button class="tool-btn" data-bs-toggle="modal" data-bs-target="#scriptModal">📝</button>
</div>

<!-- SCRIPT MODAL -->
<div class="modal fade" id="scriptModal">
<div class="modal-dialog modal-lg modal-dialog-scrollable">
<div class="modal-content text-dark">
<div class="modal-header">
<h5 class="modal-title">Script Manager</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
<input id="scriptName" class="form-control mb-2" placeholder="Script Name">
<textarea id="scriptText" rows="6" class="form-control mb-3"></textarea>
<button class="btn btn-success w-100 mb-2" id="saveScript">💾 Save</button>
<select id="scriptList" class="form-select mb-2"></select>
<button class="btn btn-primary w-100 mb-2" id="loadScript">▶ Load</button>
</div>
</div>
</div>
</div>

<script>
/* CORE */
let ctx, analyser, data, mediaRecorder;
let audioChunks=[];
let micStarted=false;
let paused=true, manualPause=false;
let scrollPos=0, speed=0.6;
let words=[], index=0;

let silenceFrames=0;
let silenceRecordFrames=0;

const FPS=60;
const MAX_SILENCE_SEC=4;

/* PREPARE TEXT */
function prepare(text){
 words=text.trim().split(/\s+/);
 $("#content").html(words.map((w,i)=>`<span class="word" data-i="${i}">${w}</span>`).join(" "));
 scrollPos=0;index=0;
}

/* MIC + RECORDING */
function startMic(){
 if(micStarted) return;
 micStarted=true;

 navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
  ctx=new AudioContext();
  analyser=ctx.createAnalyser();
  analyser.fftSize=256;
  data=new Uint8Array(analyser.frequencyBinCount);

  const src=ctx.createMediaStreamSource(stream);
  src.connect(analyser);

  // 🎙️ RECORDING
  mediaRecorder=new MediaRecorder(stream);
  mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);

  loop();
 });
}

/* LOOP */
function loop(){
 analyser.getByteFrequencyData(data);
 let energy=data.slice(10,40).reduce((a,b)=>a+b,0);
 $("#volume div").css("width",Math.min(100,energy/5)+"%");

 const VOICE_THRESHOLD = parseInt($("#sensitivity").val());

 /* AUTO RESUME */
 if(paused && !manualPause && energy>VOICE_THRESHOLD){
  paused=false;
  silenceFrames=0;
  $("#play").text("⏸");
 }

 if(!paused){
  if(energy>VOICE_THRESHOLD){
   silenceFrames=0;
   silenceRecordFrames=0;

   scrollPos+=speed;
   $("#content").css("top",-scrollPos+"px");

   // 🎯 WORD SYNC
   $(".word").removeClass("active");
   $(`.word[data-i='${Math.floor(index)}']`).addClass("active");
   index+=speed*0.03;

  }else{
   silenceFrames++;
   silenceRecordFrames++;

   if(silenceFrames>FPS){
    paused=true;
    manualPause=false;
    $("#play").text("▶");
   }
  }
 }

 /* 🎙️ RECORD SILENCE LIMIT */
 if(mediaRecorder && mediaRecorder.state==="recording"){
  if(silenceRecordFrames/FPS > MAX_SILENCE_SEC){
   mediaRecorder.pause();
  }else if(mediaRecorder.state==="paused" && energy>VOICE_THRESHOLD){
   mediaRecorder.resume();
  }
 }

 requestAnimationFrame(loop);
}

/* CONTROLS */
$("#play").click(()=>{
 if(words.length===0){alert("Script load करें");return;}
 startMic();

 paused=!paused;
 manualPause=paused;
 $("#play").text(paused?"▶":"⏸");

 if(!paused && mediaRecorder.state!=="recording"){
  audioChunks=[];
  mediaRecorder.start();
 }
 if(paused && mediaRecorder.state==="recording"){
  mediaRecorder.stop();
  mediaRecorder.onstop=()=>{
   const blob=new Blob(audioChunks,{type:"audio/webm"});
   const url=URL.createObjectURL(blob);
   const a=document.createElement("a");
   a.href=url;a.download="recording.webm";a.click();
  };
 }
});

/* SCRIPT STORAGE */
function loadList(){
 let s=JSON.parse(localStorage.getItem("teleScripts")||"{}");
 $("#scriptList").empty();
 Object.keys(s).forEach(k=>$("#scriptList").append(`<option>${k}</option>`));
}
loadList();

$("#saveScript").click(()=>{
 let s=JSON.parse(localStorage.getItem("teleScripts")||"{}");
 s[$("#scriptName").val()]=$("#scriptText").val();
 localStorage.setItem("teleScripts",JSON.stringify(s));
 loadList();
});
$("#loadScript").click(()=>{
 let s=JSON.parse(localStorage.getItem("teleScripts")||"{}");
 prepare(s[$("#scriptList").val()]);
 paused=true;manualPause=true;
 $("#play").text("▶");
});
</script>

</body>
</html>
