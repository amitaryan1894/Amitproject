<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Teleprompter</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
body{
    background:#111;
    color:#fff;
}
#prompter{
    height:70vh;
    overflow:hidden;
    border:2px solid #333;
    padding:30px;
    font-size:32px;
    line-height:1.6;
}
#content{
    position:relative;
}
.control-box label{
    font-size:14px;
}
</style>
</head>
<body>

<div class="container-fluid mt-3">

<div class="row">
    <!-- LEFT -->
    <div class="col-md-3 control-box">

        <label>Script Name</label>
        <input type="text" id="scriptName" class="form-control mb-2">

        <label>Script Text</label>
        <textarea id="scriptText" rows="5" class="form-control mb-2"></textarea>

        <button class="btn btn-success w-100 mb-2" id="saveScript">Save Script</button>

        <select id="scriptList" class="form-select mb-2"></select>

        <button class="btn btn-danger w-100 mb-3" id="deleteScript">Delete Script</button>

        <label>Font Size</label>
        <input type="range" min="20" max="80" value="32" id="fontSize" class="form-range">

        <label>Font Color</label>
        <input type="color" id="fontColor" class="form-control form-control-color mb-3">

        <label>Sensitivity</label>
        <input type="range" min="1" max="10" value="4" id="sensitivity" class="form-range">

        <button class="btn btn-primary w-100" id="startMic">Start Teleprompter</button>

    </div>

    <!-- RIGHT -->
    <div class="col-md-9">
        <div id="prompter">
            <div id="content">
                Paste or Load Script...
            </div>
        </div>
    </div>
</div>

</div>

<script>
let audioContext, analyser, mic, dataArray;
let scrollPos = 0;
let sensitivity = 4;

function startMic(){
    navigator.mediaDevices.getUserMedia({audio:true})
    .then(stream=>{
        audioContext = new AudioContext();
        analyser = audioContext.createAnalyser();
        mic = audioContext.createMediaStreamSource(stream);
        mic.connect(analyser);
        analyser.fftSize = 256;
        dataArray = new Uint8Array(analyser.frequencyBinCount);
        animateScroll();
    });
}

function animateScroll(){
    analyser.getByteFrequencyData(dataArray);
    let volume = dataArray.reduce((a,b)=>a+b) / dataArray.length;
    let speed = (volume / 100) * sensitivity;

    scrollPos += speed;
    $("#content").css("top", -scrollPos + "px");

    requestAnimationFrame(animateScroll);
}

/* Controls */
$("#fontSize").on("input",function(){
    $("#content").css("font-size",$(this).val()+"px");
});

$("#fontColor").on("input",function(){
    $("#content").css("color",$(this).val());
});

$("#sensitivity").on("input",function(){
    sensitivity = $(this).val();
});

$("#startMic").click(()=>{
    $("#content").text($("#scriptText").val());
    scrollPos = 0;
    startMic();
});

/* Script Save */
function loadScripts(){
    $("#scriptList").empty();
    let scripts = JSON.parse(localStorage.getItem("teleScripts")||"{}");
    $.each(scripts,function(k){
        $("#scriptList").append(`<option value="${k}">${k}</option>`);
    });
}

$("#saveScript").click(()=>{
    let name = $("#scriptName").val();
    let text = $("#scriptText").val();
    if(!name) return alert("Script Name Required");
    let scripts = JSON.parse(localStorage.getItem("teleScripts")||"{}");
    scripts[name] = text;
    localStorage.setItem("teleScripts",JSON.stringify(scripts));
    loadScripts();
});

$("#scriptList").change(function(){
    let scripts = JSON.parse(localStorage.getItem("teleScripts")||"{}");
    $("#scriptText").val(scripts[$(this).val()]);
});

$("#deleteScript").click(()=>{
    let name = $("#scriptList").val();
    let scripts = JSON.parse(localStorage.getItem("teleScripts")||"{}");
    delete scripts[name];
    localStorage.setItem("teleScripts",JSON.stringify(scripts));
    loadScripts();
});

loadScripts();
</script>

</body>
</html>
