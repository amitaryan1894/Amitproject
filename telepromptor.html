<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Teleprompter</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
body{
    background:#111;
    color:#fff;
    overflow:hidden;
}
#prompter{
    height:75vh;
    overflow:hidden;
    border:2px solid #333;
    padding:20px;
    font-size:clamp(20px,4vw,42px);
}
#content{
    position:relative;
    line-height:1.6;
}
.control-box{
    font-size:14px;
}
@media(max-width:768px){
    .control-box{
        position:fixed;
        bottom:0;
        left:0;
        right:0;
        background:#000;
        z-index:999;
        border-top:2px solid #333;
    }
    #prompter{
        height:85vh;
    }
}
</style>
</head>

<body>

<div class="container-fluid mt-2">
<div class="row g-2">

<!-- TELEPROMPTER -->
<div class="col-12 col-md-9 order-1">
    <div id="prompter">
        <div id="content">Load or write your script...</div>
    </div>
</div>

<!-- CONTROLS -->
<div class="col-12 col-md-3 order-2 control-box" id="controls">

<button class="btn btn-warning w-100 mb-2 d-md-none" id="toggleControls">
⚙️ Controls
</button>

<label>Script Name</label>
<input type="text" id="scriptName" class="form-control mb-2">

<label>Script Text</label>
<textarea id="scriptText" rows="4" class="form-control mb-2"></textarea>

<button class="btn btn-success w-100 mb-2" id="saveScript">Save Script</button>

<select id="playlist" class="form-select mb-2" multiple></select>

<button class="btn btn-info w-100 mb-2" id="playNext">▶️ Play Next</button>
<button class="btn btn-danger w-100 mb-2" id="deleteScript">Delete Selected</button>

<label>Font Size</label>
<input type="range" min="20" max="80" value="32" id="fontSize" class="form-range">

<label>Font Color</label>
<input type="color" id="fontColor" class="form-control form-control-color mb-2">

<label>Sensitivity</label>
<input type="range" min="1" max="10" value="4" id="sensitivity" class="form-range mb-2">

<button class="btn btn-secondary w-100 mb-2" id="mirrorBtn">🪞 Mirror Mode</button>
<button class="btn btn-primary w-100" id="startMic">🎤 Start Teleprompter</button>

</div>
</div>
</div>

<script>
let audioContext, analyser, mic, dataArray;
let scrollPos=0, sensitivity=4;
let silenceTimer=0, silenceLimit=30;
let isPaused=false, mirrored=false;
let playIndex=0;

/* MICROPHONE + SCROLL */
function startMic(){
navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
audioContext=new AudioContext();
analyser=audioContext.createAnalyser();
mic=audioContext.createMediaStreamSource(stream);
mic.connect(analyser);
analyser.fftSize=256;
dataArray=new Uint8Array(analyser.frequencyBinCount);
animateScroll();
});
}

function animateScroll(){
analyser.getByteFrequencyData(dataArray);

// Speech frequency band
let speechEnergy=0;
for(let i=10;i<40;i++){ speechEnergy+=dataArray[i]; }

if(speechEnergy<200){
silenceTimer++;
if(silenceTimer>silenceLimit) isPaused=true;
}else{
silenceTimer=0;
isPaused=false;
}

if(!isPaused){
let speed=(speechEnergy/800)*sensitivity;
scrollPos+=speed;
$("#content").css("top",-scrollPos+"px");
}

requestAnimationFrame(animateScroll);
}

/* CONTROLS */
$("#startMic").click(async ()=>{
await navigator.mediaDevices.getUserMedia({audio:true});
$("#content").text($("#scriptText").val());
scrollPos=0;
startMic();
});

$("#fontSize").on("input",e=>{
$("#content").css("font-size",e.target.value+"px");
});
$("#fontColor").on("input",e=>{
$("#content").css("color",e.target.value);
});
$("#sensitivity").on("input",e=>{
sensitivity=e.target.value;
});

/* MIRROR MODE */
$("#mirrorBtn").click(()=>{
mirrored=!mirrored;
$("#content").css("transform",mirrored?"scaleX(-1)":"scaleX(1)");
});

/* SCRIPT STORAGE */
function loadScripts(){
let scripts=JSON.parse(localStorage.getItem("teleScripts")||"{}");
$("#playlist").empty();
$.each(scripts,(k)=>{
$("#playlist").append(`<option>${k}</option>`);
});
}
loadScripts();

$("#saveScript").click(()=>{
let name=$("#scriptName").val();
let text=$("#scriptText").val();
if(!name) return alert("Script name required");
let scripts=JSON.parse(localStorage.getItem("teleScripts")||"{}");
scripts[name]=text;
localStorage.setItem("teleScripts",JSON.stringify(scripts));
loadScripts();
});

$("#playNext").click(()=>{
let scripts=JSON.parse(localStorage.getItem("teleScripts")||"{}");
let list=$("#playlist option");
if(playIndex>=list.length) return;
let name=list.eq(playIndex).text();
$("#content").text(scripts[name]);
scrollPos=0;
playIndex++;
});

$("#deleteScript").click(()=>{
let scripts=JSON.parse(localStorage.getItem("teleScripts")||"{}");
$("#playlist option:selected").each(function(){
delete scripts[$(this).text()];
});
localStorage.setItem("teleScripts",JSON.stringify(scripts));
loadScripts();
});

/* MOBILE TOGGLE */
$("#toggleControls").click(()=>{
$("#controls").toggle();
});
</script>

</body>
</html>
