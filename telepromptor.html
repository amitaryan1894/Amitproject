<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Teleprompter Upgraded</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<style>
body{margin:0;background:#000;color:#fff;overflow:hidden;}
#prompter{position:fixed;inset:0;padding:60px 20px 90px;overflow:hidden;font-size:clamp(22px,4vw,48px);}
#content{position:relative;line-height:1.6;}
.word.active{background:#ffc107;color:#000;border-radius:4px;padding:2px 4px;}
footer{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:999;transition:0.3s;}
footer.hide-footer{transform:translateY(100%);}
footer button, #speedSlider{font-size:20px;}
#content.mirror{transform:scaleX(-1);}
</style>
</head>
<body>

<div id="prompter"><div id="content">⚙️ Script modal से load करें</div></div>

<footer class="p-2 text-center">
<div class="d-flex flex-wrap justify-content-around align-items-center gap-2">
  <button class="btn btn-light" id="playPause">▶</button>
  <button class="btn btn-secondary" id="speedDown">➖</button>
  <input type="range" id="speedSlider" min="0.1" max="3" step="0.05" value="0.6" class="w-50">
  <button class="btn btn-secondary" id="speedUp">➕</button>
  <button class="btn btn-secondary" id="fontDown">A−</button>
  <button class="btn btn-secondary" id="fontUp">A+</button>
  <button class="btn btn-secondary" id="mirrorBtn">🪞</button>
  <button class="btn btn-secondary" id="highlightBtn">✨</button>
  <button class="btn btn-secondary" id="voiceBtn">🎤</button>
  <button class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#scriptModal">📜</button>
  <button class="btn btn-light" id="fullscreenBtn">⛶</button>

  <!-- New Remote Link -->
  <a href="telepromptor_remote.html" target="_blank" class="btn btn-success">📡 Open Remote</a>
</div>
</footer>
<!-- Script Modal -->
<div class="modal fade" id="scriptModal" tabindex="-1">
<div class="modal-dialog modal-dialog-scrollable modal-lg">
<div class="modal-content text-dark">
<div class="modal-header">
<h5 class="modal-title">Script Manager</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
<input class="form-control mb-2" id="scriptName" placeholder="Script name">
<textarea class="form-control mb-2" rows="4" id="scriptText" placeholder="Write script here..."></textarea>
<button class="btn btn-success w-100 mb-2" id="saveScript">💾 Save Script</button>
<select class="form-select mb-2" id="playlist" size="5"></select>
<button class="btn btn-primary w-100 mb-2" id="playScript">▶ Play Selected</button>
<button class="btn btn-danger w-100" id="deleteScript">🗑 Delete Selected</button>
</div></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyAOLJjrcw_9hi_RbwJTdRv2ZFPEKSDOrt4",
  authDomain: "github-8e32d.firebaseapp.com",
  databaseURL: "https://github-8e32d-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "github-8e32d",
  storageBucket: "github-8e32d.appspot.com",
  messagingSenderId: "301979365830",
  appId: "1:301979365830:web:21a72ef1ff0e47371482c7",
  measurementId: "G-JSV9ESJTN3"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Variables
let scrollPos=0,isPaused=true;
let manualSpeed=0.6,fontSize=40;
let highlight=false,mirror=false,voiceAssist=true;
let words=[],currentWord=0;
let audioCtx, analyser, dataArray, silence=0;

// Prepare text
function prepareText(text){
    words=text.split(/\s+/);
    $("#content").html(words.map((w,i)=>`<span data-i="${i}">${w}</span>`).join(" "));
    scrollPos=0; currentWord=0;
}

// Mic
function startMic(){if(audioCtx)return;
navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    audioCtx=new AudioContext();
    analyser=audioCtx.createAnalyser();
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    analyser.fftSize=256;
    dataArray=new Uint8Array(analyser.frequencyBinCount);
    animate();
});}

// Animate
function animate(){
    if(!analyser){requestAnimationFrame(animate);return;}
    analyser.getByteFrequencyData(dataArray);
    let energy=dataArray.slice(10,40).reduce((a,b)=>a+b,0);
    if(energy<180){silence++; if(silence>25) isPaused=true;} else {silence=0; isPaused=false;}
    if(!isPaused){
        let boost=voiceAssist?Math.min(1.4,Math.max(.8,energy/350)):1;
        scrollPos+=manualSpeed*boost;
        $("#content").css("top",-scrollPos+"px");
        if(highlight){
            $("span").removeClass("active");
            $(`span[data-i="${Math.floor(currentWord)}"]`).addClass("active");
            currentWord+=manualSpeed*0.03;
        }
    }
    requestAnimationFrame(animate);
}

/* Footer controls */
$("#playPause").click(()=>{isPaused=!isPaused;$("#playPause").text(isPaused?"▶":"⏸");if(!audioCtx)startMic();});
$("#speedUp").click(()=>{$("#speedSlider").val(Math.min(3,manualSpeed+.1)).trigger("input");});
$("#speedDown").click(()=>{$("#speedSlider").val(Math.max(.1,manualSpeed-.1)).trigger("input");});
$("#speedSlider").on("input",function(){manualSpeed=parseFloat(this.value); set(ref(db, 'teleprompter/commands'), {action:"speed", value:manualSpeed});});
$("#fontUp").click(()=>$("#prompter").css("font-size",++fontSize+"px"));
$("#fontDown").click(()=>$("#prompter").css("font-size",--fontSize+"px"));
$("#mirrorBtn").click(()=>{mirror=!mirror; $("#content").toggleClass("mirror",mirror); set(ref(db, 'teleprompter/commands'), {action:"mirror", value:mirror});});
$("#highlightBtn").click(()=>highlight=!highlight);
$("#voiceBtn").click(()=>voiceAssist=!voiceAssist);
$("#fullscreenBtn").click(()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen());

/* Script storage */
function loadList(){let s=JSON.parse(localStorage.getItem("scripts")||"{}");$("#playlist").empty();Object.keys(s).forEach(k=>$("#playlist").append(`<option>${k}</option>`));}
loadList();
$("#saveScript").click(()=>{let s=JSON.parse(localStorage.getItem("scripts")||"{}"); s[$("#scriptName").val()]=$("#scriptText").val(); localStorage.setItem("scripts",JSON.stringify(s)); loadList(); });
$("#playScript").click(()=>{let s=JSON.parse(localStorage.getItem("scripts")||"{}"); let n=$("#playlist").val(); prepareText(s[n]); isPaused=false; $("#playPause").text("⏸"); bootstrap.Modal.getInstance(scriptModal).hide(); startMic(); });
$("#deleteScript").click(()=>{let s=JSON.parse(localStorage.getItem("scripts")||"{}"); delete s[$("#playlist").val()]; localStorage.setItem("scripts",JSON.stringify(s)); loadList();});

/* Bluetooth / keyboard fallback */
document.addEventListener("keydown",e=>{if(e.code==="Space")$("#playPause").click(); if(e.code==="ArrowUp"){$("#speedSlider").val(Math.min(3,manualSpeed+.1)).trigger("input");} if(e.code==="ArrowDown"){$("#speedSlider").val(Math.max(.1,manualSpeed-.1)).trigger("input");}});

/* Footer auto-hide */
let footerTimer;
function showFooter(){
    $("footer").removeClass("hide-footer");
    clearTimeout(footerTimer);
    footerTimer=setTimeout(()=>$("footer").addClass("hide-footer"),3000);
}
$(document).on("mousemove touchstart",showFooter);
showFooter();

/* Firebase remote listener */
onValue(ref(db, 'teleprompter/commands'), snapshot=>{
    const cmd=snapshot.val();
    if(!cmd) return;
    switch(cmd.action){
        case "playPause":$("#playPause").click(); break;
        case "speed":manualSpeed=cmd.value; $("#speedSlider").val(cmd.value); break;
        case "mirror":mirror=cmd.value; $("#mirrorBtn").click(); break;
        case "nextScript":$("#playScript").click(); break;
    }
});
</script>
</body>
</html>
