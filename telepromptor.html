<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Fullscreen Teleprompter</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    overflow:hidden;
}

/* FULLSCREEN PROMPTER */
#prompter{
    position:fixed;
    top:0; left:0;
    width:100vw;
    height:100vh;
    padding:40px;
    overflow:hidden;
    font-size:clamp(22px,4vw,48px);
}

#content{
    position:relative;
    line-height:1.6;
}

/* WORD HIGHLIGHT */
.word{ padding:2px 4px; }
.word.active{
    background:#ffc107;
    color:#000;
    border-radius:4px;
}

/* TOP BAR */
#topBar{
    position:fixed;
    top:10px;
    right:10px;
    z-index:999;
}
</style>
</head>

<body>

<!-- TOP BAR -->
<div id="topBar">
    <button class="btn btn-light btn-sm me-1" id="fullscreenBtn">⛶</button>
    <button class="btn btn-warning btn-sm" data-bs-toggle="modal" data-bs-target="#settingsModal">
        ⚙️ Settings
    </button>
</div>

<!-- PROMPTER -->
<div id="prompter">
    <div id="content">Script load करें और 🎤 Start दबाएँ…</div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal fade" id="settingsModal" tabindex="-1">
<div class="modal-dialog modal-dialog-scrollable modal-lg">
<div class="modal-content text-dark">

<div class="modal-header">
<h5 class="modal-title">Teleprompter Settings</h5>
<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">

<div class="alert alert-info" id="micInfo">
🎤 Microphone permission जरूरी है
</div>

<label>Script Name</label>
<input type="text" id="scriptName" class="form-control mb-2">

<label>Script Text</label>
<textarea id="scriptText" rows="4" class="form-control mb-2"></textarea>

<button class="btn btn-success w-100 mb-3" id="saveScript">Save Script</button>

<select id="playlist" class="form-select mb-2" multiple></select>

<button class="btn btn-info w-100 mb-2" id="playNext">▶️ Play Next</button>
<button class="btn btn-danger w-100 mb-3" id="deleteScript">Delete Selected</button>

<hr>

<div class="form-check form-switch mb-2">
<input class="form-check-input" type="checkbox" id="highlightToggle">
<label class="form-check-label">Word Highlight</label>
</div>

<div class="form-check form-switch mb-3">
<input class="form-check-input" type="checkbox" id="mirrorToggle">
<label class="form-check-label">Mirror Mode</label>
</div>

<label>Font Size</label>
<input type="range" min="20" max="80" value="40" id="fontSize" class="form-range">

<label>Font Color</label>
<input type="color" id="fontColor" class="form-control form-control-color mb-3">

<label>Scroll Sensitivity</label>
<input type="range" min="1" max="10" value="4" id="sensitivity" class="form-range mb-3">

<button class="btn btn-primary w-100" id="startMic">🎤 Start Teleprompter</button>

</div>

</div>
</div>
</div>

<script>
let audioContext=null, analyser=null, mic=null;
let dataArray;
let scrollPos=0, sensitivity=4;
let silenceTimer=0, silenceLimit=30;
let isPaused=false;

let words=[], currentWord=0;
let highlightEnabled=false, mirrored=false;
let playIndex=0;

/* FULLSCREEN */
$("#fullscreenBtn").click(()=>{
    if(!document.fullscreenElement){
        document.documentElement.requestFullscreen();
    }else{
        document.exitFullscreen();
    }
});

/* PREPARE WORDS */
function prepareText(text){
    words=text.split(/\s+/);
    let html="";
    words.forEach((w,i)=>{
        html+=`<span class="word" data-i="${i}">${w}</span> `;
    });
    $("#content").html(html);
    currentWord=0;
}

/* MIC START */
function startMic(){
    if(audioContext) return;

    navigator.mediaDevices.getUserMedia({audio:true})
    .then(stream=>{
        $("#micInfo").hide();
        audioContext=new AudioContext();
        analyser=audioContext.createAnalyser();
        mic=audioContext.createMediaStreamSource(stream);
        mic.connect(analyser);
        analyser.fftSize=256;
        dataArray=new Uint8Array(analyser.frequencyBinCount);
        animateScroll();
    })
    .catch(()=>alert("Microphone permission denied"));
}

/* SCROLL + WORD HIGHLIGHT */
function animateScroll(){
    analyser.getByteFrequencyData(dataArray);

    let energy=0;
    for(let i=10;i<40;i++) energy+=dataArray[i];

    if(energy<200){
        silenceTimer++;
        if(silenceTimer>silenceLimit) isPaused=true;
    }else{
        silenceTimer=0;
        isPaused=false;
    }

    if(!isPaused){
        let speed=(energy/800)*sensitivity;
        scrollPos+=speed;
        $("#content").css("top",-scrollPos+"px");

        if(highlightEnabled){
            $(".word").removeClass("active");
            $(`.word[data-i='${Math.floor(currentWord)}']`).addClass("active");
            currentWord+=speed*0.02;
        }
    }
    requestAnimationFrame(animateScroll);
}

/* CONTROLS */
$("#startMic").click(()=>{
    prepareText($("#scriptText").val());
    scrollPos=0;
    startMic();
    bootstrap.Modal.getInstance(document.getElementById("settingsModal")).hide();
});

$("#highlightToggle").change(e=>highlightEnabled=e.target.checked);

$("#mirrorToggle").change(e=>{
    mirrored=e.target.checked;
    $("#content").css("transform",mirrored?"scaleX(-1)":"scaleX(1)");
});

$("#fontSize").on("input",e=>{
    $("#prompter").css("font-size",e.target.value+"px");
});
$("#fontColor").on("input",e=>{
    $("#content").css("color",e.target.value);
});
$("#sensitivity").on("input",e=>sensitivity=e.target.value);

/* STORAGE */
function loadScripts(){
    let s=JSON.parse(localStorage.getItem("teleScripts")||"{}");
    $("#playlist").empty();
    $.each(s,k=>$("#playlist").append(`<option>${k}</option>`));
}
loadScripts();

$("#saveScript").click(()=>{
    let n=$("#scriptName").val(), t=$("#scriptText").val();
    if(!n) return alert("Script name required");
    let s=JSON.parse(localStorage.getItem("teleScripts")||"{}");
    s[n]=t;
    localStorage.setItem("teleScripts",JSON.stringify(s));
    loadScripts();
});

$("#playNext").click(()=>{
    let s=JSON.parse(localStorage.getItem("teleScripts")||"{}");
    let list=$("#playlist option");
    if(playIndex>=list.length) playIndex=0;
    let name=list.eq(playIndex).text();
    $("#scriptText").val(s[name]);
    prepareText(s[name]);
    scrollPos=0;
    playIndex++;
});

$("#deleteScript").click(()=>{
    let s=JSON.parse(localStorage.getItem("teleScripts")||"{}");
    $("#playlist option:selected").each(function(){
        delete s[$(this).text()];
    });
    localStorage.setItem("teleScripts",JSON.stringify(s));
    loadScripts();
});
</script>

</body>
</html>
