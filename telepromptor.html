<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Pro Teleprompter – Smart Voice Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
body{margin:0;background:#000;color:#fff;overflow:hidden;font-family:system-ui;}
#prompter{position:fixed;inset:0;padding:40px 40px 120px;font-size:40px;}
#content{position:relative;line-height:1.7}
.word.active{background:#ffc107;color:#000;border-radius:4px;padding:2px 4px}

/* TOOLS */
/* TOOLS TOGGLE BUTTON */
#toolsToggle{
 position:fixed;
 left:10px;
 top:50%;
 transform:translateY(-50%);
 z-index:1000;
 background:#0d6efd;
 color:#fff;
 border:none;
 border-radius:8px;
 padding:8px 10px;
 font-size:20px;
}

/* LEFT TOOLS PANEL */
#tools{
 position:fixed;
 left:0;
 top:0;
 bottom:0;
 width:70px;
 background:rgba(0,0,0,.85);
 display:flex;
 flex-direction:column;
 gap:8px;
 padding:10px 6px;
 transform:translateX(-100%);
 transition:.3s ease;
 z-index:999;
}

#tools.show{
 transform:translateX(0);
}

.tool-btn{
 background:#222;
 color:#fff;
 border:none;
 border-radius:8px;
 padding:8px;
 font-size:18px;
}

.tool-btn.active{
 background:#0d6efd;
}

#tools input{
 width:100%;
}
.tool-range{width:80px}

/* VOLUME */
#volume{
 position:fixed;left:10px;bottom:70px;
 width:120px;height:8px;background:#333;
 border-radius:5px;overflow:hidden
}
#volume div{height:100%;width:0%;background:#0d6efd}
</style>
</head>

<body>

<div id="prompter">
 <div id="content">📝 Script जोड़ें और ▶ दबाएँ…</div>
</div>

<div id="volume"><div></div></div>

<!-- TOOLS TOGGLE -->
<button id="toolsToggle">☰</button>

<!-- LEFT TOOLS PANEL -->
<div id="tools" class="hidden">
 <button class="tool-btn" id="play">▶</button>
 <button class="tool-btn" id="rewind">⏪</button>

 <button class="tool-btn active" id="voice">🎤</button>
 <button class="tool-btn" id="highlight">🔦</button>
 <button class="tool-btn" id="mirror">🪞</button>

 <input type="range" min="0.1" max="3" step="0.1" id="speed">
 <input type="range" min="20" max="80" id="fontSize">
 <input type="color" id="fontColor">

 <button class="tool-btn" data-bs-toggle="modal" data-bs-target="#scriptModal">📝</button>
 <button class="tool-btn" id="fullscreen">⛶</button>
</div>

<!-- SCRIPT MODAL -->
<div class="modal fade" id="scriptModal">
<div class="modal-dialog modal-lg modal-dialog-scrollable">
<div class="modal-content text-dark">
<div class="modal-header">
<h5 class="modal-title">Script Manager</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
<label>Script Name</label>
<input id="scriptName" class="form-control mb-2">
<label>Script Text</label>
<textarea id="scriptText" rows="6" class="form-control mb-3"></textarea>
<button class="btn btn-success w-100 mb-2" id="saveScript">💾 Save / Update</button>
<select id="scriptList" class="form-select mb-2"></select>
<button class="btn btn-primary w-100 mb-2" id="loadScript">▶ Load Script</button>
<button class="btn btn-danger w-100" id="deleteScript">🗑 Delete Script</button>
</div>
</div>
</div>
</div>

<script>
/* ================= CORE ================= */
let wakeLock = null;
let ctx, analyser, data;
let micStarted=false;
let scrollPos=0, speed=0.6, paused=true;
let voice=true, highlight=false, mirrored=false;
let words=[], index=0;
let rewinding=false;

/* ========== VOICE & SILENCE ========== */
let manualVoiceOff=false;
let silenceStartTime=null;
let autoRewinding=false;
let autoRewindStart=0;

const VOICE_THRESHOLD=120;
const SILENCE_REWIND_AFTER=2000;
const AUTO_REWIND_DURATION=2000;
const AUTO_REWIND_SPEED=1.2;

/* ================= STORAGE ================= */
const LS={
 voice:"tp_voice",
 highlight:"tp_highlight",
 mirror:"tp_mirror",
 speed:"tp_speed",
 fontSize:"tp_fontSize",
 fontColor:"tp_fontColor",
 lastScript:"tp_lastScript"
};

function saveSetting(k,v){localStorage.setItem(k,JSON.stringify(v));}
function loadSetting(k,d){return JSON.parse(localStorage.getItem(k)??JSON.stringify(d));}

 /* ================= SCREEN WAKE LOCK ================= */

async function enableWakeLock(){
 try{
  if('wakeLock' in navigator && !wakeLock){
   wakeLock = await navigator.wakeLock.request('screen');
   console.log("🔒 Wake Lock Enabled");

   wakeLock.addEventListener('release', ()=>{
    console.log("🔓 Wake Lock Released");
    wakeLock = null;
   });
  }
 }catch(err){
  console.warn("Wake Lock Failed:", err);
 }
}

function disableWakeLock(){
 if(wakeLock){
  wakeLock.release();
  wakeLock = null;
 }
}

/* ================= INIT ================= */
$(function(){
 voice=loadSetting(LS.voice,true);
 highlight=loadSetting(LS.highlight,false);
 mirrored=loadSetting(LS.mirror,false);
 speed=loadSetting(LS.speed,0.6);
 let fs=loadSetting(LS.fontSize,40);
 let fc=loadSetting(LS.fontColor,"#ffffff");

 $("#voice").toggleClass("active",voice);
 $("#highlight").toggleClass("active",highlight);
 $("#mirror").toggleClass("active",mirrored);
 $("#speed").val(speed);
 $("#fontSize").val(fs);
 $("#fontColor").val(fc);
 $("#prompter").css("font-size",fs+"px");
 $("#content").css("color",fc);
 $("#content").css("transform",mirrored?"scaleX(-1)":"");
});

/* ================= TEXT ================= */
function prepare(text){
 words=text.trim().split(/\s+/);
 $("#content").html(words.map((w,i)=>`<span class="word" data-i="${i}">${w}</span>`).join(" "));
 scrollPos=0;index=0;
}

/* ================= MIC ================= */
function startMic(){
 if(micStarted) return;
 micStarted=true;
 navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{
  ctx=new AudioContext();
  analyser=ctx.createAnalyser();
  let src=ctx.createMediaStreamSource(s);
  src.connect(analyser);
  analyser.fftSize=256;
  data=new Uint8Array(analyser.frequencyBinCount);
  loop();
 });
}

/* ================= LOOP ================= */
function loop(){
 analyser.getByteFrequencyData(data);
 let energy=data.slice(10,40).reduce((a,b)=>a+b,0);
 $("#volume div").css("width",Math.min(100,energy/5)+"%");

 let now=performance.now();

 if(!voice && !manualVoiceOff && energy>VOICE_THRESHOLD){
  voice=true;
  $("#voice").addClass("active");
  saveSetting(LS.voice,true);
  silenceStartTime=null;
  autoRewinding=false;
 }

 if(voice && energy<=VOICE_THRESHOLD){
  if(!silenceStartTime) silenceStartTime=now;
  if(!autoRewinding && now-silenceStartTime>=SILENCE_REWIND_AFTER){
   autoRewinding=true;
   autoRewindStart=now;
  }
 }else{
  silenceStartTime=null;
 }

 if(!paused){
  if(autoRewinding){
   let e=now-autoRewindStart;
   if(e<=AUTO_REWIND_DURATION){
    scrollPos=Math.max(0,scrollPos-AUTO_REWIND_SPEED);
    index=Math.max(0,index-0.03);
    $("#content").css("top",-scrollPos+"px");
   }else autoRewinding=false;
   requestAnimationFrame(loop);return;
  }

  if(voice && energy>VOICE_THRESHOLD){
   let boost=Math.min(1.6,energy/300);
   scrollPos+=speed*boost;
   if(highlight){
    $(".word").removeClass("active");
    $(`.word[data-i='${Math.floor(index)}']`).addClass("active");
    index+=speed*0.025;
   }
  }
  $("#content").css("top",-scrollPos+"px");
 }
 requestAnimationFrame(loop);
}

/* ================= CONTROLS ================= */
$("#play").click(()=>{
 if(words.length===0){
  alert("पहले Script load करें");
  return;
 }

 startMic();
 paused = !paused;
 $("#play").text(paused ? "▶" : "⏸");

 if(!paused){
  enableWakeLock();   // 🔒 screen awake
 }else{
  disableWakeLock();  // 🔓 allow sleep
 }
});

 document.addEventListener("visibilitychange", ()=>{
 if(document.hidden){
  disableWakeLock();
 }else if(!paused){
  enableWakeLock();
 }
});

$("#voice").click(()=>{
 voice=!voice;
 manualVoiceOff=!voice;
 $("#voice").toggleClass("active",voice);
 saveSetting(LS.voice,voice);
});

$("#highlight").click(()=>{
 highlight=!highlight;
 $("#highlight").toggleClass("active",highlight);
 saveSetting(LS.highlight,highlight);
});

$("#mirror").click(()=>{
 mirrored=!mirrored;
 $("#mirror").toggleClass("active",mirrored);
 $("#content").css("transform",mirrored?"scaleX(-1)":"");
 saveSetting(LS.mirror,mirrored);
});

$("#speed").on("input",e=>{
 speed=parseFloat(e.target.value);
 saveSetting(LS.speed,speed);
});

$("#fontSize").on("input",e=>{
 $("#prompter").css("font-size",e.target.value+"px");
 saveSetting(LS.fontSize,e.target.value);
});

$("#fontColor").on("input",e=>{
 $("#content").css("color",e.target.value);
 saveSetting(LS.fontColor,e.target.value);
});

/* ================= SCRIPT STORAGE (FIXED) ================= */

function loadList(){
 let s = JSON.parse(localStorage.getItem("teleScripts") || "{}");
 $("#scriptList").empty();
 Object.keys(s).forEach(k=>{
  $("#scriptList").append(`<option value="${k}">${k}</option>`);
 });
}
loadList();

/* SAVE / UPDATE */
$("#saveScript").off("click").on("click", ()=>{
 let name = $("#scriptName").val().trim();
 let text = $("#scriptText").val().trim();

 if(!name || !text){
  alert("Script Name और Text दोनों जरूरी हैं");
  return;
 }

 let scripts = JSON.parse(localStorage.getItem("teleScripts") || "{}");
 scripts[name] = text;

 localStorage.setItem("teleScripts", JSON.stringify(scripts));
 loadList();

 alert("Script Saved / Updated ✔");
});

/* LOAD */
$("#loadScript").off("click").on("click", ()=>{
 let key = $("#scriptList").val();
 if(!key) return;

 let scripts = JSON.parse(localStorage.getItem("teleScripts") || "{}");
 prepare(scripts[key]);

 $("#scriptName").val(key);
 $("#scriptText").val(scripts[key]);

 localStorage.setItem("tp_lastScript", JSON.stringify(key));

 paused = true;
 $("#play").text("▶");
});

/* DELETE */
$("#deleteScript").off("click").on("click", ()=>{
 let key = $("#scriptList").val();
 if(!key){
  alert("पहले Script select करें");
  return;
 }

 if(!confirm("क्या आप वाकई इस Script को delete करना चाहते हैं?")) return;

 let scripts = JSON.parse(localStorage.getItem("teleScripts") || "{}");
 delete scripts[key];

 localStorage.setItem("teleScripts", JSON.stringify(scripts));
 loadList();

 $("#scriptName").val("");
 $("#scriptText").val("");
 $("#content").html("📝 Script जोड़ें और ▶ दबाएँ…");

 alert("Script Deleted ✔");
});
 /* AUTO-FILL SCRIPT NAME & TEXT ON SELECT */
$("#scriptList").on("change", function(){
 let key = $(this).val();
 if(!key) return;

 let scripts = JSON.parse(localStorage.getItem("teleScripts") || "{}");

 $("#scriptName").val(key);
 $("#scriptText").val(scripts[key] || "");
});

 /* TOOLS SHOW / HIDE */
$("#toolsToggle").click(()=>{
 $("#tools").toggleClass("show");
});
</script>

</body>
</html>
