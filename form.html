<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Google Form Embed</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg, #e3f2fd, #ffffff);
    font-family: 'Segoe UI', sans-serif;
}

.form-container {
    max-width: 800px;
    margin: 50px auto;
}

.card {
    border: none;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

.card-header {
    background: #0d6efd;
    color: white;
    font-size: 20px;
    font-weight: 600;
    text-align: center;
    padding: 15px;
}

iframe {
    width: 100%;
    height: 900px;
    border: none;
}

@media (max-width: 768px) {
    iframe {
        height: 1100px;
    }
}
</style>

</head>

<body>

<div class="container form-container">
    <div class="card">
        <div class="card-header">
            📋 Fill the Form
        </div>
        <div class="card-body p-0">
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScYntS2asVjjHB6Ow3_s2RwzbLEn4skuLZTzhlBqi7O-9Ipyw/viewform?embedded=true">
            </iframe>
        </div>
    </div>
</div>

</body>
</html>
