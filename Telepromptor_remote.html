<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teleprompter Remote</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="p-3">
<h4>Teleprompter Remote</h4>
<div class="d-flex flex-wrap gap-2">
<button class="btn btn-primary w-100" id="playPause">▶ / ⏸</button>
<button class="btn btn-secondary w-50" id="speedUp">Speed +</button>
<button class="btn btn-secondary w-50" id="speedDown">Speed −</button>
<input type="range" id="speedSlider" min="0.1" max="3" step="0.05" value="0.6" class="w-100">
<button class="btn btn-warning w-100" id="next">Next Script</button>
<button class="btn btn-info w-100" id="mirror">Mirror Toggle</button>
</div>

<script>
// Firebase config
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT.firebaseio.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "XXX",
    appId: "XXX"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function sendCommand(cmd){db.ref('teleprompter/commands').set(cmd);}

$("#playPause").click(()=>sendCommand({action:"playPause"}));
$("#speedUp").click(()=>sendCommand({action:"speed", value:1.0}));
$("#speedDown").click(()=>sendCommand({action:"speed", value:0.6}));
$("#speedSlider").on("input",function(){sendCommand({action:"speed", value:parseFloat(this.value)});});
$("#next").click(()=>sendCommand({action:"nextScript"}));
$("#mirror").click(()=>sendCommand({action:"mirror", value:true}));
</script>
</body>
</html>
